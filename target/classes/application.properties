spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
app.jwt.secret=${JWT_SECRET:placement-management-system-secret-key-must-be-at-least-32-characters-long}
app.jwt.expiration-ms=86400000
